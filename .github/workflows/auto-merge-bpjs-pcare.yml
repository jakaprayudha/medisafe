name: Auto-merge bpjs_pcare into pkfi_deli_serdang

on:
  push:
    branches:
      - bpjs_pcare

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: pkfi_deli_serdang

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge bpjs_pcare
        run: |
          git merge origin/bpjs_pcare -m "Merge branch 'bpjs_pcare' into pkfi_deli_serdang" --no-edit

      - name: Push
        run: git push origin pkfi_deli_serdang
